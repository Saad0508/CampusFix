<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusFix - Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <h1>CampusFix</h1>
        <p>Campus Service & Complaint Management System</p>
    </header>

    <main class="login-main">
        <section class="card login-card">
            <h2>Welcome Back</h2>
            <p class="muted">Sign in to report and track campus complaints.</p>

            {% if error %}
            <div class="error">{{ error }}</div>
            {% endif %}

            <form action="{{ url_for('do_login') }}" method="POST">
                <label for="email">College Email</label>
                <input id="email" name="email" type="email"
                       placeholder="student@campusfix.com" required>

                <label for="password">Password</label>
                <input id="password" name="password" type="password"
                       placeholder="Enter password" required>

                <button type="submit">Sign In</button>
            </form>

            <div class="demo">
                <strong>Demo Login</strong><br>
                Email: student@campusfix.com<br>
                Password: 123456
            </div>
        </section>
    </main>
</body>
</html>
